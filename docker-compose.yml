x-service-healthcheck: &svc-health
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 5s

services:

  traefik:
    image: traefik:v3.6
    container_name: extractext_traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--api.insecure=true"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - extractext_net

  mongo:
    image: mongo:7
    container_name: extractext_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - extractext_net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10

  consul:
    image: hashicorp/consul:2.1
    container_name: extractext_consul
    ports:
      - "8500:8500"
    command: agent -dev -ui -client=0.0.0.0
    networks:
      - extractext_net
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 3s
      retries: 10

  pdf-extractxt-redis:
    image: redis:7-alpine
    container_name: extractext_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - extractext_net

  pdf-extractxt-api:
    build:
      context: https://github.com/Tomas-Ojeda/extractext-api-gateway.git#main
      dockerfile: dockerfile
    image: extractext/api-gateway:latest
    restart: unless-stopped
    environment:
      INGESTION_URL: http://pdf-extractxt-ingestion:8000
      STORAGE_URL: http://pdf-extractxt-storage:8000
      PDF_MAX_SIZE_MB: 10
      STORAGE_TIMEOUT_SECONDS: 10
      INGESTION_TIMEOUT_SECONDS: 45
      WEB_CONCURRENCY: "2"
      CONSUL_URL: http://consul:8500
      SERVICE_NAME: api-gateway
      REDIS_URL: redis://pdf-extractxt-redis:6379/0
      CACHE_TTL_SECONDS: 60
    depends_on:
      pdf-extractxt-ingestion:
        condition: service_healthy
      pdf-extractxt-storage:
        condition: service_healthy
      consul:
        condition: service_healthy
      pdf-extractxt-redis:
        condition: service_healthy
    healthcheck: *svc-health
    networks:
      - extractext_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.extractext.rule=Host(`extractext.localhost`)"
      - "traefik.http.routers.extractext.entrypoints=web"
      - "traefik.http.services.extractext.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.mw-retry.retry.attempts=3"
      - "traefik.http.middlewares.mw-ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.mw-ratelimit.ratelimit.burst=200"
      - "traefik.http.middlewares.mw-cb.circuitbreaker.expression=NetworkErrorRatio() > 0.30 || ResponseCodeRatio(500, 600, 0, 600) > 0.25"
      - "traefik.http.routers.extractext.middlewares=mw-ratelimit,mw-cb,mw-retry"

  pdf-extractxt-extractor:
    build:
      context: https://github.com/Tomas-Ojeda/extractext-extractor.git#main
      dockerfile: dockerfile
    image: extractext/extractor:latest
    restart: unless-stopped
    environment:
      PDF_MAX_SIZE_MB: 10
      WEB_CONCURRENCY: "2"
      CONSUL_URL: http://consul:8500
      SERVICE_NAME: extractor
    depends_on:
      consul:
        condition: service_healthy
    healthcheck: *svc-health
    networks:
      - extractext_net

  pdf-extractxt-ingestion:
    build:
      context: https://github.com/Tomas-Ojeda/extractext-ingestion.git#main
      dockerfile: dockerfile
    image: extractext/ingestion:latest
    restart: unless-stopped
    environment:
      EXTRACTOR_URL: http://pdf-extractxt-extractor:8000
      STORAGE_URL: http://pdf-extractxt-storage:8000
      STORAGE_TIMEOUT_SECONDS: 10
      EXTRACTOR_TIMEOUT_SECONDS: 30
      WEB_CONCURRENCY: "2"
      CONSUL_URL: http://consul:8500
      SERVICE_NAME: ingestion
    depends_on:
      pdf-extractxt-storage:
        condition: service_healthy
      pdf-extractxt-extractor:
        condition: service_healthy
      consul:
        condition: service_healthy
    healthcheck: *svc-health
    networks:
      - extractext_net

  pdf-extractxt-storage:
    build:
      context: https://github.com/Tomas-Ojeda/extractext-storage.git#main
      dockerfile: dockerfile
    image: extractext/storage:latest
    restart: unless-stopped
    environment:
      MONGODB_URL: mongodb://extractext_mongo:27017
      MONGODB_DB_NAME: extractext
      LIST_DEFAULT_LIMIT: 50
      LIST_MAX_LIMIT: 100
      WEB_CONCURRENCY: "2"
      CONSUL_URL: http://consul:8500
      SERVICE_NAME: storage
    depends_on:
      mongo:
        condition: service_healthy
      consul:
        condition: service_healthy
    healthcheck: *svc-health
    networks:
      - extractext_net
    deploy:
      replicas: 3

  portainer:
    image: portainer/portainer-ce:lts
    container_name: extractext_portainer
    restart: unless-stopped
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - extractext_net

volumes:
  mongo_data:
  portainer_data:

networks:
  extractext_net:
    driver: bridge
