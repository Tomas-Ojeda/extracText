services:

  traefik:
    image: traefik:v3.6
    container_name: extractext_traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--api.insecure=true"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - extractext_net

  mongo:
    image: mongo:7
    container_name: extractext_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - extractext_net

  # ─────────────────────────────────────────────────────────
  # Consul - Service Discovery
  # ─────────────────────────────────────────────────────────
  consul:
    image: hashicorp/consul:latest
    container_name: extractext_consul
    ports:
      - "8500:8500"
    command: agent -dev -ui -client=0.0.0.0
    networks:
      - extractext_net

  # ─────────────────────────────────────────────────────────
  # Microservicio: API Gateway (FastAPI) - Punto de entrada
  # ─────────────────────────────────────────────────────────
  pdf-extractxt-api:
    build:
      context: ./microservices/api-gateway
      dockerfile: dockerfile
    image: extractext/api-gateway:latest
    restart: unless-stopped
    environment:
      INGESTION_URL: http://pdf-extractxt-ingestion:8000
      STORAGE_URL: http://pdf-extractxt-storage:8000
      PDF_MAX_SIZE_MB: 10
      STORAGE_TIMEOUT_SECONDS: 10
      INGESTION_TIMEOUT_SECONDS: 45
      WEB_CONCURRENCY: "2"
    depends_on:
      - pdf-extractxt-ingestion
      - pdf-extractxt-storage
      - consul
    networks:
      - extractext_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.extractext.rule=Host(`extractext.localhost`)"
      - "traefik.http.routers.extractext.entrypoints=web"
      - "traefik.http.services.extractext.loadbalancer.server.port=8000"

  # ─────────────────────────────────────────────────────────
  # Microservicio: PDF Extractor (FastAPI + pypdf) - Interno
  # ─────────────────────────────────────────────────────────
  pdf-extractxt-extractor:
    build:
      context: ./microservices/extractor
      dockerfile: dockerfile
    image: extractext/extractor:latest
    restart: unless-stopped
    environment:
      PDF_MAX_SIZE_MB: 10
      WEB_CONCURRENCY: "2"
    depends_on:
      - consul
    networks:
      - extractext_net

  # ─────────────────────────────────────────────────────────
  # Microservicio: Ingestion (FastAPI) - Orquestador síncrono
  # ─────────────────────────────────────────────────────────
  pdf-extractxt-ingestion:
    build:
      context: ./microservices/ingestion
      dockerfile: dockerfile
    image: extractext/ingestion:latest
    restart: unless-stopped
    environment:
      EXTRACTOR_URL: http://pdf-extractxt-extractor:8000
      STORAGE_URL: http://pdf-extractxt-storage:8000
      STORAGE_TIMEOUT_SECONDS: 10
      EXTRACTOR_TIMEOUT_SECONDS: 30
      WEB_CONCURRENCY: "2"
    depends_on:
      - pdf-extractxt-extractor
      - pdf-extractxt-storage
      - consul
    networks:
      - extractext_net

  # ─────────────────────────────────────────────────────────
  # Microservicio: Document Storage (FastAPI + MongoDB)
  # ─────────────────────────────────────────────────────────
  pdf-extractxt-storage:
    build:
      context: ./microservices/storage
      dockerfile: dockerfile
    image: extractext/storage:latest
    restart: unless-stopped
    environment:
      MONGODB_URL: mongodb://extractext_mongo:27017
      MONGODB_DB_NAME: extractext
      LIST_DEFAULT_LIMIT: 50
      LIST_MAX_LIMIT: 100
      WEB_CONCURRENCY: "2"
    depends_on:
      - mongo
    networks:
      - extractext_net
    deploy:
      replicas: 3

volumes:
  mongo_data:

networks:
  extractext_net:
    driver: bridge
