services:

  traefik:
    image: traefik:v3.6
    container_name: extractext_traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--api.insecure=true"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - extractext_net

  mongo:
    image: mongo:7
    container_name: extractext_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - extractext_net

  # ─────────────────────────────────────────────────────────
  # Microservicio: API Gateway (FastAPI) - Punto de entrada
  # ─────────────────────────────────────────────────────────
  pdf-extractxt-api:
    build:
      context: ./microservices/api-gateway
      dockerfile: dockerfile
    image: extractext/api-gateway:latest
    restart: unless-stopped
    environment:
      EXTRACTOR_URL: http://pdf-extractxt-extractor:8000
      STORAGE_URL: http://pdf-extractxt-storage:8000
      UV_CACHE_DIR: /tmp/uv-cache
    depends_on:
      - pdf-extractxt-extractor
      - pdf-extractxt-storage
    networks:
      - extractext_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.extractext.rule=Host(`extractext.localhost`)"
      - "traefik.http.routers.extractext.entrypoints=web"
      - "traefik.http.services.extractext.loadbalancer.server.port=8000"

  # ─────────────────────────────────────────────────────────
  # Microservicio: PDF Extractor (FastAPI + pypdf) - Interno
  # ─────────────────────────────────────────────────────────
  pdf-extractxt-extractor:
    build:
      context: ./microservices/extractor
      dockerfile: dockerfile
    image: extractext/extractor:latest
    restart: unless-stopped
    environment:
      PDF_MAX_SIZE_MB: 10
      UV_CACHE_DIR: /tmp/uv-cache
    networks:
      - extractext_net

  # ─────────────────────────────────────────────────────────
  # Microservicio: Document Storage (FastAPI + MongoDB) - Interno
  # ─────────────────────────────────────────────────────────
  pdf-extractxt-storage:
    build:
      context: ./microservices/storage
      dockerfile: dockerfile
    image: extractext/storage:latest
    restart: unless-stopped
    environment:
      MONGODB_URL: mongodb://extractext_mongo:27017
      MONGODB_DB_NAME: extractext
      UV_CACHE_DIR: /tmp/uv-cache
    depends_on:
      - mongo
    networks:
      - extractext_net
    deploy:
      replicas: 3

volumes:
  mongo_data:

networks:
  extractext_net:
    driver: bridge
